name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Publish
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
